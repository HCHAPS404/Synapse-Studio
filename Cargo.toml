[workspace]
resolver = "2"
members = [
  "crates/neuron-syntax",
  "crates/neuron-nir",
  "crates/neuron-sema",
  "crates/neuron-target",
  "crates/neuron-mir",
  "crates/neuron-codegen-c",
  "crates/neuron-sim-avr",
  "crates/neuron-sim-thumb",
  "crates/neuron-interp",
  "crates/neuron-lsp",
  "crates/neuron-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/HCHAPS404/Synapse-Studio"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
proptest = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
