neuron-nir = { path = "../neuron-nir" }
neuron-target = { path = "../neuron-target" }
neuron-mir = { path = "../neuron-mir" }
neuron-codegen-c = { path = "../neuron-codegen-c" }
neuron-codegen-hdl = { path = "../neuron-codegen-hdl" }
neuron-native-avr = { path = "../neuron-native-avr" }
neuron-ui = { path = "../neuron-ui" }
