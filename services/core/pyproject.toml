[project]
name = "synapse-core"
version = "0.0.1"
description = "SYNAPSE Studio Core API (projects, compilation, devices, twin gateway)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "greenlet>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]
