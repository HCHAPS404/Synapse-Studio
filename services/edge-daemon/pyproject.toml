[project]
name = "synapse-daemon"
version = "0.1.0"
description = "SYNAPSE Studio Edge Daemon (drivers, relay client, pairing, signed packages)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "websockets>=13",
  "httpx>=0.27",
  "cryptography>=43",
  "pyserial>=3.5",
  "pymodbus>=3.6",
  "python-snap7>=1.3",
  "aiomqtt>=2.3",
  "python-can>=4.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "jsonschema>=4.22",
]

[project.scripts]
synapse-daemon = "synapse_daemon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests spin up loopback servers, fake tools and in-process brokers.
"tests/*" = ["S104", "S108", "S603", "S607", "S105", "S106", "B008"]
