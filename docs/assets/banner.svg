  </g>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="172" font-size="76" font-weight="800" fill="#e8f1ff" letter-spacing="6">SYNAPSE<tspan fill="#39ff9c"> STUDIO</tspan></text>
    <text x="600" y="218" font-size="24" fill="#a9b8d6">One language. Every machine. Powered by <tspan fill="#c4a8ff" font-weight="700">Neuron</tspan>.</text>
    <text x="600" y="262" font-size="16" fill="#6f7f9f" letter-spacing="3">DESIGN ONCE · SIMULATE IN 3D · COMPILE TO ANY MACHINE</text>
