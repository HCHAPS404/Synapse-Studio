# Render Blueprint for the Core API.
# Plan: paid "starter" (always on). Free instances spin down after 15 minutes of
# inactivity and take about one minute to wake up, which is not acceptable for
# judges (judging period: 2026-12-16 to 2027-01-29).
# Secrets (SYNAPSE_DATABASE_URL from Neon) are set in the Render dashboard, never here.
services:
  - type: web
    name: synapse-core
    # Docker image (E2.10): a Rust stage builds the `neuron` CLI so the API can run real
    # check/build/emit jobs, plus the Python service. The image sets SYNAPSE_NEURON_BIN and
    # SYNAPSE_DEVICES_DIR. The build is slower than the old python runtime (the Rust stage);
    # if it ever times out on Render, the fallback is a check/emit-only image without the
    # Rust stage (the compile runner degrades safely when `neuron` is absent).
    runtime: docker
    dockerfilePath: services/core/Dockerfile
    dockerContext: .
    plan: starter
    # TODO(region): the service runs in Oregon (Render default) while Neon is in AWS US East 2
    # (Ohio). Render cannot change the region of an existing service. To fix: add
    # `region: ohio` here, delete and recreate the service, then set SYNAPSE_DATABASE_URL and
    # update the Vercel API URL. Cost today: about 50-70 ms per database round trip.
    # No rootDir under Docker runtime: the Dockerfile's build context is the repo root
    # (it needs crates/ for the Rust stage and devices/, targets/, lib/, spec/ for data).
    # Runs once before each deploy goes live, after the build and with the env vars below.
    # Brings the database schema to the latest Alembic revision; a failed migration blocks
    # the deploy, so the new code never starts against an old schema. Idempotent: on an
    # already-migrated database `alembic upgrade head` is a no-op.
    preDeployCommand: uv run --no-dev alembic upgrade head
    # The server command is the Dockerfile CMD (uvicorn on $PORT).
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SYNAPSE_ENVIRONMENT
        value: production
      # Secrets: set each value in the Render dashboard (Environment), never here.
      # SYNAPSE_DATABASE_URL  Neon Postgres URL. Use the *pooled* host for the running
      #   service; migrations run fine over it too (single connection, no transaction
      #   pooling concern for DDL). See docs/deploy.md for the pooled-vs-direct note.
      - key: SYNAPSE_DATABASE_URL
        sync: false
      # SYNAPSE_JWT_SECRET  >= 32-byte HMAC key for guest tokens (E2.8) and user JWTs (E3).
      #   Required in production (settings.token_secret raises without it).
      - key: SYNAPSE_JWT_SECRET
        sync: false
      # SYNAPSE_SIGNING_KEY  base64 Ed25519 32-byte seed for signing deployment packages (E5.2).
      - key: SYNAPSE_SIGNING_KEY
        sync: false
      # SYNAPSE_GUEST_IP_SALT  salt for the one-way hash of a guest's IP (E2.8). Optional, but
      #   set a stable value in production so guest IP hashes are consistent across restarts.
      - key: SYNAPSE_GUEST_IP_SALT
        sync: false
      - key: SYNAPSE_CORS_ORIGINS
        # Production web on Vercel: synapsest.vercel.app (the old -eight URL redirects to it).
        # synapse-studio.vercel.app and synapsestudio.vercel.app belong to other people.
        value: '["https://synapsest.vercel.app","https://synapse-studio-eight.vercel.app"]'
