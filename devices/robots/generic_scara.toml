# Generic four-axis SCARA robot (small payload class). Generic numbers, no vendor data.
[device]
name = "generic_scara"
kind = "robot"
dialects = ["robot", "core"]
backend = "spel"
profile = "generic"
trust = "generic"
vendor_class = "spel_style"
note = "Generic placeholder numbers; timing is measured in lab session I6."

[io]
digital_in = { prefix = "I", volts = 24.0, kind = "sink" }
digital_out = { prefix = "O", volts = 24.0, max_ma = 100 }

[timing]
scan_min = "4 ms"
modbus_tcp = { transport = "3 ms", jitter = "1 ms" }

[safety]
safe_state_time = "50 ms"

[robot]
name = "generic_scara"
kind = "scara"
reach_mm = 500.0
shoulder_height_mm = 200.0
z_min_mm = 0.0
z_max_mm = 250.0
# J1, J2 and J4 are rotary (degrees); J3 is the linear axis and is checked through z.
joint_limits_deg = [
  [-130.0, 130.0],
  [-145.0, 145.0],
  [-360.0, 360.0],
  [-360.0, 360.0],
]
