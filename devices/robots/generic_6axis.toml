# Generic six-axis articulated robot (a medium payload class). Numbers are generic and
# round on purpose: they describe no vendor's product. Replace them with the limits of
# your robot before using the output on hardware.
[device]
name = "generic_6axis"
kind = "robot"
dialects = ["robot", "core"]
backend = "spel"
profile = "generic"
trust = "generic"
vendor_class = "spel_style"
note = "Generic placeholder numbers; timing is measured in lab session I6."

[io]
digital_in = { prefix = "I", volts = 24.0, kind = "sink" }
digital_out = { prefix = "O", volts = 24.0, max_ma = 100 }

[timing]
scan_min = "4 ms"
modbus_tcp = { transport = "3 ms", jitter = "1 ms" }

[safety]
safe_state_time = "50 ms"

[robot]
name = "generic_6axis"
kind = "articulated"
# Maximum distance from the shoulder point (the J2 axis on the base axis) to the tool flange.
reach_mm = 700.0
# Height of the shoulder point above the base plane.
shoulder_height_mm = 300.0
# Allowed range of the flange height above the base plane, after applying frames.
z_min_mm = -100.0
z_max_mm = 900.0
# Software limits of J1..J6 as [min, max].
joint_limits_deg = [
  [-170.0, 170.0],
  [-135.0, 65.0],
  [-60.0, 150.0],
  [-190.0, 190.0],
  [-135.0, 135.0],
  [-360.0, 360.0],
]
