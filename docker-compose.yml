# Local development: the Core API and a Postgres, mirroring the production image (E2.10).
# Usage (from the repository root):
#   docker compose up --build
#   open http://localhost:8000/health  and  http://localhost:8000/docs
# The secrets below are throwaway local values, never the production ones.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_ENVIRONMENT: development
      SYNAPSE_DATABASE_URL: postgresql+asyncpg://synapse:synapse@db:5432/synapse
      SYNAPSE_JWT_SECRET: local-dev-secret-change-me-0000000000
      SYNAPSE_CORS_ORIGINS: '["http://localhost:3000"]'
      PORT: "8000"
    ports:
      - "8000:8000"
    # Apply migrations, then start the server (same as the Render preDeployCommand + start).
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn synapse_core.main:app --host 0.0.0.0 --port 8000"
