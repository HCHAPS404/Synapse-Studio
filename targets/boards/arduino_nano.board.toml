schema = 1
name = "arduino_nano"
source = "Own description. Classic Arduino Nano (and the common CH340 clones): the same ATmega328P and 16 MHz crystal as the UNO R3. Pin names are the labels printed on the board; the mapping is public board documentation."
trust = "community"
tier = "runtime"
chip = "atmega328p"
runtime = "baremetal-avr"
crystal_hz = 16000000
voltage_mv = 5000
note = "Classic ATmega328P Nano. Builds, simulates in the AVR simulator, and flashes with avrdude. The old bootloader runs at 57600 baud (not 115200); on a clone the USB-serial chip is usually a CH340 (VID 1A86 / PID 7523) and needs the CH340 driver for a COM port to appear. The Nano also exposes A6 and A7, which are analog-input only (no digital GPIO)."
[pins]
