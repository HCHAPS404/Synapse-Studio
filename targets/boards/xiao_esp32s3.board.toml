schema = 1
name = "xiao_esp32s3"
source = "Generated by tools/gen-targets.ps1. Public board documentation."
trust = "community"
tier = "sdk"
chip = "esp32s3"
runtime = "esp-idf"
crystal_hz = 40000000
sysclk_hz = 240000000
voltage_mv = 3300
note = "ESP-IDF port: neuron writes an idf.py project and builds it when ESP-IDF is installed. The user LED is active low."

[pins]
D0 = "GPIO1"
D1 = "GPIO2"
D2 = "GPIO3"
D3 = "GPIO4"
D4 = "GPIO5"
D5 = "GPIO6"
D6 = "GPIO43"
D7 = "GPIO44"
D8 = "GPIO7"
D9 = "GPIO8"
D10 = "GPIO9"

[leds]
builtin = "GPIO21"

[programmer]
tool = "esptool"
