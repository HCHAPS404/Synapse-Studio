name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Hackathon compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the commits of each push; a shallow clone lacks their history.
          fetch-depth: 0
      - name: .kiro present and not gitignored
        shell: pwsh
        run: ./tools/check-kiro-not-ignored.ps1
      - name: Apache-2.0 license file present
        run: grep -q "Apache License" LICENSE && grep -q "Version 2.0" LICENSE
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Toolchains for the backend tests (avr-gcc, arm-none-eabi-gcc, iverilog, yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr \
            gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi iverilog yosys
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compiler bindings build for WebAssembly (E1)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p neuron-wasm --target wasm32-unknown-unknown --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (the backend, port, FPGA, simulator and Python tests must not skip)
        env:
          NEURON_REQUIRE_PYTHON: "1"
          NEURON_REQUIRE_TOOLCHAIN: "1"
          NEURON_REQUIRE_ARM: "1"
          NEURON_REQUIRE_HDL: "1"
        run: cargo test --workspace
      - name: Analyze the examples package
        run: cargo run --quiet -p neuron-cli -- check examples
      - name: Examples are formatted
        run: cargo run --quiet -p neuron-cli -- fmt --check examples
      - name: Every test of the examples package passes as one package
        run: cargo run --quiet -p neuron-cli -- test examples
      - name: Validation corpus is checked, formatted and tested
        run: |
          for d in examples/corpus/*/; do
            cargo run --quiet -p neuron-cli -- check "$d"
            cargo run --quiet -p neuron-cli -- fmt --check "$d"
            cargo run --quiet -p neuron-cli -- test "$d"
          done
      - name: Translation smoke runs (emit to ST, SPEL+, Python and kernel; import the ST back)
        run: |
          neuron="cargo run --quiet -p neuron-cli --"
          $neuron emit st examples/corpus/plc/p06_pump_with_levels.neuron -o out/st
          $neuron emit spel examples/corpus/robot/r02_palletize.neuron -o out/spel
          $neuron emit python examples/corpus/host/h01_gateway_counter.neuron -o out/python
          $neuron emit kernel examples/corpus/mcu/m06_traffic_light.neuron -o out/kernel
          $neuron import st out/st/p06_pump_with_levels.st -o out/imported/p06_pump_with_levels.neuron
          $neuron check out/imported/p06_pump_with_levels.neuron
      - name: Standard library is formatted, checked and tested
        run: |
          cargo run --quiet -p neuron-cli -- fmt --check lib
          cargo run --quiet -p neuron-cli -- check lib
          cargo run --quiet -p neuron-cli -- test lib

  core:
    name: Core API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
